services:
  multipanda_ros2_dev:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: multipanda_ros2_devcontainer
    network_mode: "host"
    ipc: "host" 
    pid: "host"
    privileged: true
    command: /bin/bash
    tty: true
    stdin_open: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - /dev:/dev
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - RCUTILS_COLORIZED_OUTPUT=1
      - SHELL=/bin/bash
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856